# Alternative Render blueprint for the Bench Street backend.
#
# Canonical production deployment:
#   Frontend: https://benchstreet.vercel.app
#   API:      https://bench-street-api-production.up.railway.app
#
# Use this blueprint only when intentionally moving the backend away from Railway.
# Update Vercel's VITE_API_URL after the replacement Render health endpoint and
# Socket.io connection have both been verified.
#
# Free-tier caveats:
#   - The service can sleep when idle and cold-start on the next request.
#   - Without a persistent disk, SQLite data is ephemeral.
services:
  - type: web
    name: bench-street-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '22.14.0'
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://benchstreet.vercel.app
      # Configure these explicitly before using Render for production:
      # - key: ADMIN_USER_IDS
      #   value: '<numeric user IDs>'
      # - key: DATA_DIR
      #   value: /var/data
