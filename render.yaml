# Bench Street API — Render Blueprint
#
# Deploy: Render Dashboard → New → Blueprint → select this repo
# Or: https://dashboard.render.com/select-repo?type=blueprint
#
# After deploy, set Vercel env:
#   VITE_API_URL=https://<your-service>.onrender.com
#
# Notes:
# - Free plan sleeps after ~15 min idle (cold starts). Use Starter for always-on.
# - Persistent disk is required for SQLite. Free plan has no disk → data is lost on restart.
#   Starter (or higher) includes disk support.

services:
  - type: web
    name: bench-street-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://benchstreet.vercel.app,https://client-xi-orcin.vercel.app
      - key: STARTING_BALANCE
        value: "100000"
      # Optional — set after first login if you want admins:
      # - key: ADMIN_USER_IDS
      #   value: "1"

# Uncomment + switch plan to "starter" (or higher) when you want persistent data + no sleep:
#    plan: starter
#    disk:
#      name: data
#      mountPath: /data
#      sizeGB: 1
