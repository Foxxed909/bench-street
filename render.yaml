# Bench Street API — Render Blueprint
#
# Deploy: Render Dashboard → New → Blueprint → select this repo
# After deploy, set Vercel env:
#   VITE_API_URL=https://bench-street-api.onrender.com
#
# Free plan notes:
# - Sleeps after ~15 min idle (cold starts).
# - No persistent disk → SQLite is wiped on every restart/deploy.
#   For real persistence, upgrade to Starter and enable the disk block below.

services:
  - type: web
    name: bench-street-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Free plan has no mounted disk. Use a path inside the app (writable).
      # When you upgrade to Starter, change this to /data and uncomment the disk block.
      - key: DATA_DIR
        value: "./data"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://benchstreet.vercel.app,https://client-xi-orcin.vercel.app
      - key: STARTING_BALANCE
        value: "100000"

# --- When you upgrade to Starter (or higher) for always-on + persistent SQLite ---
# Change plan to "starter", set DATA_DIR to "/data", and uncomment:
#    plan: starter
#    disk:
#      name: data
#      mountPath: /data
#      sizeGB: 1
