# Render blueprint for the Bench Street backend (Node + Express + Socket.io + SQLite).
# Deploy: push this repo to GitHub → Render → New → Blueprint → pick the repo.
#
# Free-tier caveats (fine for a demo, not for "always live"):
#   - The service sleeps after ~15 min idle and cold-starts on the next request.
#   - The disk is ephemeral: the SQLite DB resets on each deploy/restart, then
#     re-seeds automatically on boot (models/markets/battles return; votes/trades reset).
#   For persistence + no sleeping, use a paid instance with a Disk mounted at server/data,
#   or host on Railway/Fly instead.
services:
  - type: web
    name: bench-street-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '22.14.0'
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Lock this down to your Vercel URL once deployed, e.g. https://bench-street.vercel.app
      - key: CLIENT_ORIGIN
        value: '*'
